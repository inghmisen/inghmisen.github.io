# Fetches the news feeds and republishes data.json on a schedule.
# GitHub Pages serves the static site from this branch, so a pushed
# data.json is all it takes to update the site.
name: Update news data

on:
  schedule:
    # Every 30 minutes. GitHub schedules start on the hour and can be
    # delayed several minutes under load — fine for a news briefing.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button, for testing

permissions:
  contents: write # commit + push data.json

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch feeds and rebuild briefings
        run: python generate_data.py

      # generate_data.py leaves the data files untouched when nothing changed,
      # so this commits only when the news actually moved.
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Update news data [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
