<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
  <title>Daily Briefing — AI, UTwente, Morocco, NL &amp; the wars</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f3f7;
      --surface: #ffffff;
      --surface-2: #eef0f5;
      --ink: #15171c;
      --ink-soft: #4b4f58;
      --muted: #8b909c;
      --line: #e4e6ee;
      --acc-ua: #2f6fed;   --acc-ua-2: #e8a91d;
      --acc-me: #0f9d8a;   --acc-me-2: #35c4b0;
      --acc-ma: #d92b55;   --acc-ma-2: #ff7a9c;
      --acc-nl: #e0671f;   --acc-nl-2: #ffa064;
      --acc-ai: #7c5cfa;   --acc-ai-2: #a78bfa;
      --acc-ut: #0891b2;   --acc-ut-2: #38cfe0;
      --good: #16a34a;
      --bad: #e5484d;
      --chip: #eef0f5;
      --shadow: 0 1px 2px rgba(18, 20, 28, .05), 0 10px 30px -12px rgba(18, 20, 28, .12);
      --shadow-lift: 0 2px 4px rgba(18, 20, 28, .06), 0 18px 40px -14px rgba(18, 20, 28, .2);
      --r-lg: 22px;
      --r-md: 16px;
      --r-pill: 999px;
      --sans: ui-sans-serif, -apple-system, "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1116;
        --surface: #171a21;
        --surface-2: #1f232c;
        --ink: #f0f2f7;
        --ink-soft: #b8bdca;
        --muted: #7d8394;
        --line: #262b35;
        --acc-ua: #5b8ff5;   --acc-ua-2: #f0b429;
        --acc-me: #2cc0aa;   --acc-me-2: #58dccb;
        --acc-ma: #ff5d80;   --acc-ma-2: #d92b55;
        --acc-nl: #ff8a47;   --acc-nl-2: #c8531a;
        --acc-ai: #9b7dff;   --acc-ai-2: #7c5cfa;
        --acc-ut: #3ccbe6;   --acc-ut-2: #0891b2;
        --good: #3ddc84;
        --bad: #ff6b6e;
        --chip: #232833;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -14px rgba(0, 0, 0, .55);
        --shadow-lift: 0 2px 6px rgba(0, 0, 0, .45), 0 20px 44px -16px rgba(0, 0, 0, .65);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(900px 420px at 85% -10%, color-mix(in srgb, var(--acc-ai) 10%, transparent), transparent 65%),
        radial-gradient(900px 420px at 10% -10%, color-mix(in srgb, var(--acc-ma) 11%, transparent), transparent 65%),
        var(--bg);
      color: var(--ink);
      font: 15px/1.55 var(--sans);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .app { max-width: 1180px; margin: 0 auto; padding: 28px 24px 56px; }

    /* ---------- app bar ---------- */
    .app-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .logo {
      width: 44px; height: 44px;
      border-radius: 13px;
      display: grid; place-items: center;
      font-size: 21px;
      background: linear-gradient(135deg, var(--acc-ma), var(--acc-ai));
      box-shadow: var(--shadow);
    }
    .app-bar h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
    .app-bar .tagline { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
    .pills { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: var(--r-pill);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-soft);
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px color-mix(in srgb, #22c55e 22%, transparent);
    }
    .fx b { font-weight: 800; color: var(--ink); }
    .fx .up { color: var(--good); font-weight: 800; }
    .fx .down { color: var(--bad); font-weight: 800; }

    /* ---------- segmented lane switch (mobile only) ---------- */
    .tabs { display: none; }
    @media (max-width: 880px) {
      /* Six lanes never fit one pill row on a phone — 2 rows of 3. */
      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        padding: 4px;
        margin: 18px 0 2px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow);
        position: sticky;
        top: 10px;
        z-index: 20;
      }
      .tabs button {
        min-width: 0;
        border: 0;
        border-radius: 14px;
        padding: 10px 4px;
        font: 700 12.5px var(--sans);
        color: var(--ink-soft);
        background: transparent;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background .18s ease, color .18s ease;
      }
      .tabs button.active { background: var(--ink); color: var(--bg); }
      .tabs button:focus-visible { outline: 2px solid var(--acc-ma); outline-offset: 2px; }
      body.tabs-active .lane { display: none; }
      body.tabs-active .lane.show { display: block; }
    }

    /* ---------- lane cards ---------- */
    main {
      margin-top: 26px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
      gap: 26px;
      align-items: start;
    }
    .lane {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: box-shadow .25s ease, transform .25s ease;
    }
    .lane:hover { box-shadow: var(--shadow-lift); }
    .ai          { --accent: var(--acc-ai); --accent-2: var(--acc-ai-2); }
    .utoday      { --accent: var(--acc-ut); --accent-2: var(--acc-ut-2); }
    .morocco     { --accent: var(--acc-ma); --accent-2: var(--acc-ma-2); }
    .netherlands { --accent: var(--acc-nl); --accent-2: var(--acc-nl-2); }
    .mideast     { --accent: var(--acc-me); --accent-2: var(--acc-me-2); }
    .ukraine     { --accent: var(--acc-ua); --accent-2: var(--acc-ua-2); }

    .lane-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 22px 18px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface) 70%);
      border-bottom: 1px solid var(--line);
    }
    .lane-badge {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 21px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: var(--shadow);
    }
    .lane-head h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.015em; }
    .stories-chip {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: var(--r-pill);
      background: var(--chip);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .lane-body { padding: 18px 22px 10px; }

    /* ---------- clusters (keyword groups) ---------- */
    .cluster + .cluster { margin-top: 8px; border-top: 1px solid var(--line); }
    .cluster-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 2px 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cluster-label::before {
      content: "";
      width: 12px; height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    /* ---------- stories ---------- */
    .stories { margin: 0; padding: 0; list-style: none; }
    .stories li { border-radius: var(--r-md); transition: background .15s ease; }
    .stories li:hover { background: var(--surface-2); }
    .stories li + li { border-top: 1px solid var(--line); }
    .story-link {
      display: block;
      padding: 13px 12px;
      text-decoration: none;
      color: inherit;
      border-radius: inherit;
    }
    .story-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    /* The single top story of the lane (only the FIRST cluster gets it). */
    .cluster:first-child .stories li:first-child .story-link { padding: 16px 14px; }
    .cluster:first-child .stories li:first-child .story-title {
      font-size: 20px; line-height: 1.3; font-weight: 800; letter-spacing: -0.018em;
    }
    .cluster:first-child .stories li:first-child .story-title::before {
      content: "LEAD";
      display: inline-block;
      vertical-align: 3px;
      margin-right: 8px;
      padding: 3px 8px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font: 800 9.5px/1 var(--sans);
      letter-spacing: 0.12em;
    }
    .story-title {
      font-size: 14px;
      font-weight: 650;
      line-height: 1.42;
      color: var(--ink);
      text-wrap: pretty;
      transition: color .15s ease;
    }
    .story-link:hover .story-title { color: var(--accent); }
    .story-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 600;
    }
    .source-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      background: var(--chip);
      color: var(--ink-soft);
      font-size: 11px;
      letter-spacing: 0.02em;
    }
    .source-chip::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .empty { padding: 18px 14px; margin: 0; color: var(--muted); font-weight: 600; }

    /* ---------- notices ---------- */
    .notice {
      margin-top: 24px;
      padding: 20px 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      border-top: 3px solid #ef4444;
    }
    .notice strong { display: block; font-size: 15.5px; font-weight: 800; margin-bottom: 5px; }
    .notice p { margin: 0; color: var(--ink-soft); font-size: 14px; }
    .loading {
      margin-top: 26px;
      padding: 20px 22px;
      text-align: center;
      color: var(--muted);
      font-weight: 600;
    }

    footer {
      margin-top: 34px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    footer span + span::before { content: "·"; margin-right: 10px; }

    @media (max-width: 880px) {
      .app { padding: 18px 14px 44px; }
      .app-bar h1 { font-size: 18px; }
      .app-bar .tagline { display: none; }
      .pills { width: 100%; margin-left: 0; }
      .lane-head { padding: 16px 16px 14px; }
      .lane-body { padding: 14px 14px 8px; }
      .cluster:first-child .stories li:first-child .story-title { font-size: 18px; }
      footer { flex-direction: column; align-items: center; gap: 2px; }
      footer span + span::before { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-bar">
      <div class="logo" aria-hidden="true">🗞️</div>
      <div>
        <h1>Daily Briefing</h1>
        <p class="tagline">🤖 AI &nbsp;·&nbsp; 📍 UTwente &nbsp;·&nbsp; 🇲🇦 Morocco &nbsp;·&nbsp; 🇳🇱 Netherlands &nbsp;·&nbsp; 🌍 Middle East &nbsp;·&nbsp; 🇺🇦 Ukraine</p>
      </div>
      <div class="pills">
        <span class="pill fx" id="fxchip" hidden></span>
        <span class="pill" id="dateline" hidden></span>
      </div>
    </header>

    <div id="content">
      <p class="loading">Loading today’s headlines…</p>
    </div>

    <footer id="footer" hidden></footer>
  </div>

  <!-- Committed by generate_data.py: window.__NEWS__ = {...}. Script tags
       load on file:// where fetch() is blocked, so double-clicking index.html
       renders from this. Over http(s) the fetch below wins and stays fresher. -->
  <script src="data.js"></script>
  <script>
    // Render the page from data.json (written by generate_data.py on a
    // schedule): topic lanes, each with keyword-labeled clusters of headlines,
    // plus the EUR/MAD rate chip. Refetches every few minutes and whenever the
    // tab regains focus, so an always-open tab keeps itself current.
    var REFRESH_MS = 5 * 60 * 1000;
    var timer = null;
    var loadedOnce = false;

    // Short labels for the mobile switcher (6 lanes, full titles don't fit).
    var TAB_LABELS = {
      ai: "AI", utoday: "UTwente", morocco: "Morocco",
      netherlands: "NL", mideast: "Mideast", ukraine: "Ukraine"
    };

    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function safeUrl(url) {
      return /^https?:\/\//i.test(url || "") ? url : "#";
    }

    function storyHTML(a) {
      return '<li><a class="story-link" href="' + esc(safeUrl(a.url)) + '" target="_blank" rel="noopener">' +
        '<span class="story-title">' + esc(a.title) + '</span>' +
        '<span class="story-meta"><span class="source-chip">' + esc(a.source) + '</span>' +
        esc(a.published_at) + '</span></a></li>';
    }

    function laneHTML(lane) {
      var body = "";
      (lane.clusters || []).forEach(function (c) {
        var stories = (c.articles || []).map(storyHTML).join("");
        if (!stories) return;
        body += '<div class="cluster">' +
          (c.label ? '<h3 class="cluster-label">' + esc(c.label) + '</h3>' : "") +
          '<ol class="stories">' + stories + '</ol></div>';
      });
      if (!body) {
        body = '<p class="empty">' + esc(lane.note || "No stories right now.") + '</p>';
      } else if (lane.note) {
        // e.g. some of this lane's feeds were unreachable.
        body += '<p class="empty">' + esc(lane.note) + '</p>';
      }
      return '<section class="lane ' + esc(lane.key) + '" id="lane-' + esc(lane.key) +
        '" aria-label="' + esc(lane.title) + '">' +
        '<div class="lane-head">' +
        '<span class="lane-badge" aria-hidden="true">' + esc(lane.icon) + '</span>' +
        '<h2>' + esc(lane.title) + '</h2>' +
        '<span class="stories-chip">' + (lane.count || 0) + ' stories</span>' +
        '</div><div class="lane-body">' + body + '</div></section>';
    }

    function noticeHTML(title, message) {
      return '<div class="notice"><strong>' + esc(title) + '</strong><p>' + esc(message) +
        '</p></div>';
    }

    function fxHTML(fx) {
      if (!fx || !fx.rate) return "";
      var delta = "";
      if (fx.change_pct !== null && fx.change_pct !== undefined) {
        var up = fx.change_pct >= 0;
        delta = ' <span class="' + (up ? "up" : "down") + '">' + (up ? "▲" : "▼") + " " +
          Math.abs(fx.change_pct).toFixed(2) + "%</span>";
      }
      return "€1 = <b>" + esc(fx.rate.toFixed(3)) + " MAD</b>" + delta;
    }

    function render(data) {
      var dateline = document.getElementById("dateline");
      if (data.generated_at) {
        dateline.hidden = false;
        dateline.innerHTML =
          '<span class="live-dot" aria-hidden="true"></span>' +
          esc(data.date || "") + (data.generated_at ? " · refreshed " + esc(data.generated_at) : "");
      }

      var fxchip = document.getElementById("fxchip");
      var fx = fxHTML(data.fx);
      fxchip.hidden = !fx;
      fxchip.innerHTML = fx;

      var footer = document.getElementById("footer");
      footer.hidden = false;
      footer.innerHTML =
        "<span>" + (data.total_stories || 0) + " stories today</span>" +
        "<span>Public RSS feeds · no API keys · no tracking</span>";

      var content = document.getElementById("content");
      var lanes = data.lanes || [];

      if (!lanes.length) {
        content.innerHTML = noticeHTML("Couldn’t load the news",
          (data.error || "No data has been published yet.") +
          " — this is usually a temporary problem with the feeds. The page refreshes itself.");
        return;
      }

      var tabs = lanes.length > 1
        ? '<nav class="tabs" aria-label="Switch topic">' + lanes.map(function (l) {
            var label = TAB_LABELS[l.key] || l.title;
            return '<button type="button" data-target="' + esc(l.key) + '" role="tab" aria-selected="false">' +
              esc(l.icon) + " " + esc(label) + "</button>";
          }).join("") + "</nav>"
        : "";

      content.innerHTML = tabs + "<main>" + lanes.map(laneHTML).join("") + "</main>" +
        (data.error ? noticeHTML("Some feeds are failing", data.error) : "");

      initTabs();
    }

    // Mobile lane switch. CSS gates the hiding behind the narrow
    // breakpoint + .tabs-active, so with JS disabled everything stays stacked.
    function initTabs() {
      var tabs = document.querySelector(".tabs");
      if (!tabs) return;
      var lanes = Array.prototype.slice.call(document.querySelectorAll(".lane"));
      if (lanes.length < 2) return;
      document.body.classList.add("tabs-active");
      function show(key) {
        lanes.forEach(function (l) { l.classList.toggle("show", l.id === "lane-" + key); });
        tabs.querySelectorAll("button").forEach(function (b) {
          var on = b.dataset.target === key;
          b.classList.toggle("active", on);
          b.setAttribute("aria-selected", on ? "true" : "false");
        });
      }
      tabs.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-target]");
        if (b) show(b.dataset.target);
      });
      show(lanes[0].id.replace("lane-", ""));
    }

    function load() {
      clearTimeout(timer);
      // On file:// there is no way to fetch data.json (browsers block it), so
      // render the data.js snapshot the page shipped with and stop there.
      if (location.protocol === "file:") {
        if (window.__NEWS__) { render(window.__NEWS__); loadedOnce = true; }
        else document.getElementById("content").innerHTML =
          noticeHTML("No data.js found", "Run python generate_data.py next to index.html, then reload.");
        return;
      }
      // Cache-busting query: GitHub Pages caches branch-deployed files for
      // ~10 minutes; a fresh query string always reaches the current file.
      fetch("data.json?nocache=" + Date.now(), { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("data.json returned " + r.status);
          return r.json();
        })
        // loadedOnce flips only after a FULLY successful render; anything
        // that throws leaves it false so the error surfaces below instead of
        // the page sitting on "Loading…" forever.
        .then(function (data) { render(data); loadedOnce = true; })
        .catch(function (err) {
          // Live fetch failed — fall back to the shipped data.js snapshot.
          if (window.__NEWS__) { render(window.__NEWS__); loadedOnce = true; return; }
          if (!loadedOnce) {
            document.getElementById("content").innerHTML =
              noticeHTML("Couldn’t load the news data", String(err.message || err) +
                ". The page will keep retrying every few minutes.");
          }
        })
        .finally(function () { timer = setTimeout(load, REFRESH_MS); });
    }

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) load();
    });

    load();
  </script>
</body>
</html>
